name: Sync plugin releases to catalog PRs

on:
  schedule:
    # Nominal 4x the intended hourly cadence: GitHub Actions delays and
    # silently drops schedule events under load (observed ~25% of hourly
    # slots firing), so this lands at roughly one effective run per hour.
    # Safe to over-schedule: each run is an idempotent full sync and the
    # plugin-catalog-sync concurrency group prevents overlap.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

concurrency:
  group: plugin-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Detect optional DBX Store App credentials
        id: app-config
        env:
          APP_ID: ${{ secrets.DBX_STORE_AUTOMATION_APP_ID }}
          PRIVATE_KEY: ${{ secrets.DBX_STORE_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create DBX Store App token
        id: app-token
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DBX_STORE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.DBX_STORE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: t8y2
          repositories: dbx-store

      - name: Check out DBX Store
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover published plugin releases
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          node scripts/discover-plugin-releases.mjs automation/plugin-sources.json /tmp/dbx-plugin-releases.json

      - name: Create or update catalog PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          bash scripts/sync-plugin-releases.sh /tmp/dbx-plugin-releases.json
