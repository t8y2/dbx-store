name: Sign plugin PR candidates

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number with candidates/*.json awaiting store signing
        required: true
        type: string
      sdk-ref:
        description: Reviewed DBX tag or commit containing the packager contract
        default: plugin-cli-v0.1.2
        required: true
        type: string
  workflow_call:
    inputs:
      pr-number:
        description: Pull request number with candidates/*.json awaiting store signing
        type: string
        required: true
      sdk-ref:
        description: Reviewed DBX tag or commit containing the packager contract
        type: string
        default: plugin-cli-v0.1.2

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plugin-pr-signing-${{ inputs.pr-number }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.actor == 't8y2' && 'plugin-signing-owner' || 'plugin-signing' }}
    env:
      SIGNING_KEY_ID: ${{ vars.DBX_STORE_SIGNING_KEY_ID }}
      R2_ENDPOINT: ${{ vars.DBX_R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.DBX_R2_BUCKET || 'dbx' }}
      R2_PUBLIC_BASE_URL: ${{ vars.DBX_R2_PUBLIC_BASE_URL }}
      PR_NUMBER: ${{ inputs.pr-number }}
    steps:
      - name: Resolve pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRepositoryOwner,headRepository,headRefName,headRefOid,baseRefName > pr.json
          node <<'NODE'
          const fs = require("node:fs");
          const pr = JSON.parse(fs.readFileSync("pr.json", "utf8"));
          const outputs = {
            head_repo: `${pr.headRepositoryOwner.login}/${pr.headRepository.name}`,
            head_ref: pr.headRefName,
            head_sha: pr.headRefOid,
            base_ref: pr.baseRefName,
          };
          for (const [key, value] of Object.entries(outputs)) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          path: pr

      - name: Sync base branch state into pull request branch
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          git config user.name "dbx-store-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BASE_REF"
          # Overlay the base branch's store state instead of a true merge: a
          # merge would carry .github changes, and the Actions App token cannot
          # push workflow files back to fork branches.
          rm -rf /tmp/pr-publishers /tmp/pr-plugin-sources.json
          mkdir -p /tmp/pr-publishers
          cp publishers/*.json /tmp/pr-publishers/ 2>/dev/null || true
          cp automation/plugin-sources.json /tmp/pr-plugin-sources.json 2>/dev/null || true
          git rm -r -q --ignore-unmatch plugins catalog publishers schemas scripts automation signing-keys.json revoked.json
          git checkout FETCH_HEAD -- plugins catalog publishers schemas scripts automation signing-keys.json revoked.json
          # First submissions register their publisher and automation source on
          # the PR branch; the overlay must keep them or validate rejects the
          # unregistered publisher. Existing base records always win.
          for file in /tmp/pr-publishers/*.json; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            if [ ! -f "publishers/$name" ]; then
              cp "$file" "publishers/$name"
              git add "publishers/$name"
            fi
          done
          if [ -f /tmp/pr-plugin-sources.json ] && [ -f automation/plugin-sources.json ]; then
            node <<'NODE'
            const fs = require("node:fs");
            const path = "automation/plugin-sources.json";
            const base = JSON.parse(fs.readFileSync(path, "utf8"));
            const pr = JSON.parse(fs.readFileSync("/tmp/pr-plugin-sources.json", "utf8"));
            const byRepository = new Map((base.plugins ?? []).map((entry) => [entry.repository, entry]));
            for (const entry of pr.plugins ?? []) {
              if (!byRepository.has(entry.repository)) byRepository.set(entry.repository, entry);
            }
            base.plugins = [...byRepository.values()];
            fs.writeFileSync(path, `${JSON.stringify(base, null, 2)}\n`);
          NODE
            git add automation/plugin-sources.json
          fi
          if ! git diff --cached --quiet; then
            git commit -q -m "chore(store): sync base branch before signing PR #${PR_NUMBER}"
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Check out reviewed DBX packager
        uses: actions/checkout@v4
        with:
          repository: t8y2/dbx
          ref: ${{ inputs.sdk-ref }}
          path: .dbx-plugin-sdk

      - name: Verify repository signing key
        working-directory: pr
        run: |
          if [[ ! "$SIGNING_KEY_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]]; then
            echo "::error::Configure DBX_STORE_SIGNING_KEY_ID as a repository variable"
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const keys = JSON.parse(fs.readFileSync("signing-keys.json", "utf8")).keys;
          const revoked = JSON.parse(fs.readFileSync("revoked.json", "utf8")).signingKeys;
          const key = keys.find((entry) => entry.id === process.env.SIGNING_KEY_ID);
          if (!key) throw new Error(`Unregistered repository signing key ${process.env.SIGNING_KEY_ID}`);
          if (key.status !== "active") throw new Error(`Repository signing key ${process.env.SIGNING_KEY_ID} is not active`);
          if (revoked.includes(process.env.SIGNING_KEY_ID)) throw new Error(`Repository signing key ${process.env.SIGNING_KEY_ID} is revoked`);
          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_SIGNING_PUBLIC_KEY=${key.publicKey}\n`);
          NODE

      - name: Verify R2 publishing configuration
        working-directory: pr
        shell: bash
        run: |
          set -euo pipefail
          [[ "$R2_ENDPOINT" =~ ^https:// ]] || { echo "::error::Configure DBX_R2_ENDPOINT as a repository variable"; exit 1; }
          [[ "$R2_PUBLIC_BASE_URL" =~ ^https:// ]] || { echo "::error::Configure DBX_R2_PUBLIC_BASE_URL as a repository variable"; exit 1; }
          [[ "$R2_BUCKET" =~ ^[a-z0-9.-]{3,63}$ ]] || { echo "::error::Configure a valid DBX_R2_BUCKET"; exit 1; }

      - name: Validate candidates and build signing plan
        working-directory: pr
        run: |
          node scripts/validate.mjs --plan-candidates > "$GITHUB_WORKSPACE/plan.json"
          node -e '
          const fs = require("node:fs");
          const plan = JSON.parse(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/plan.json`, "utf8"));
          if (plan.candidates.length === 0) {
            console.error("::error::This pull request has no open candidates awaiting DBX Store signing.");
            process.exit(1);
          }
          '

      - name: Verify candidate permissions match package manifests
        working-directory: pr
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const { execFileSync } = require("node:child_process");
          const plan = JSON.parse(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/plan.json`, "utf8"));
          const mismatches = [];
          for (const candidate of plan.candidates) {
            const target = candidate.targets[0];
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), "permcheck-"));
            try {
              const file = path.join(dir, "artifact.dbxp");
              execFileSync("curl", ["-fsSL", "--max-time", "300", "-o", file, target.url], { stdio: "inherit" });
              execFileSync("unzip", ["-o", "-q", file, "manifest.json", "-d", dir]);
              const manifest = JSON.parse(fs.readFileSync(path.join(dir, "manifest.json"), "utf8"));
              const packagePermissions = JSON.stringify([...(manifest.permissions ?? [])].sort());
              let candidatePermissions;
              if (Array.isArray(candidate.permissions)) {
                candidatePermissions = JSON.stringify([...candidate.permissions].sort());
              } else {
                // Version-only candidates omit listing fields; finalize keeps
                // the published entry's permissions, so those are the catalog
                // values clients will see and what the package must match.
                let published = [];
                try {
                  published = JSON.parse(fs.readFileSync(path.join("plugins", `${candidate.id}.json`), "utf8")).permissions ?? [];
                } catch {}
                candidatePermissions = JSON.stringify([...published].sort());
              }
              if (packagePermissions !== candidatePermissions) {
                mismatches.push(`${candidate.id}@${candidate.version}: package=${packagePermissions} candidate=${candidatePermissions}`);
              }
            } finally {
              fs.rmSync(dir, { recursive: true, force: true });
            }
          }
          if (mismatches.length > 0) {
            console.error(`::error::Candidate permissions do not match the package manifests; clients reject such updates with a permission-mismatch error. Fix the candidate permissions (or the upstream store metadata) and re-run: ${mismatches.join("; ")}`);
            process.exit(1);
          }
          console.log(`Permission check passed for ${plan.candidates.length} candidate(s).`);
          NODE

      - name: Sign candidates
        working-directory: pr
        env:
          DBX_PLUGIN_SIGNING_KEY: ${{ secrets.DBX_STORE_SIGNING_KEY }}
          DBX_PLUGIN_SIGNING_PUBLIC_KEY: ${{ env.EXPECTED_SIGNING_PUBLIC_KEY }}
        run: |
          node scripts/sign-candidates.mjs \
            --plan "$GITHUB_WORKSPACE/plan.json" \
            --key-id "$SIGNING_KEY_ID" \
            --packager "$GITHUB_WORKSPACE/.dbx-plugin-sdk/plugins/sdk/packager/Cargo.toml" \
            --artifact-base-url "$R2_PUBLIC_BASE_URL" \
            --out "$GITHUB_WORKSPACE/signout"

      - name: Publish signed assets
        working-directory: pr
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DBX_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DBX_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
        run: |
          set -euo pipefail
          signout="$GITHUB_WORKSPACE/signout"
          aws s3api head-bucket --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT"
          while IFS=$'\t' read -r key file; do
            if aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
              echo "::error::R2 object already exists and cannot be overwritten: $key"
              exit 1
            fi
            content_type="application/octet-stream"
            [[ "$file" == *.json ]] && content_type="application/json"
            aws s3 cp "$signout/$file" "s3://$R2_BUCKET/$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "$content_type" \
              --cache-control "public, max-age=31536000, immutable" \
              --only-show-errors
          done < <(node -e '
          const fs = require("node:fs");
          const uploads = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + "/signout/uploads.json", "utf8"));
          for (const upload of uploads) for (const file of upload.files) console.log(`${upload.prefix}/${file}\t${file}`);
          ')

      - name: Finalize plugin listings
        working-directory: pr
        run: |
          node scripts/finalize-candidates.mjs \
            --signing-key-id "$SIGNING_KEY_ID" \
            --artifact-base-url "$R2_PUBLIC_BASE_URL" \
            --signed "$GITHUB_WORKSPACE/signout/signed.json"
          node scripts/validate.mjs

      - name: Commit finalized catalog back to the pull request
        id: pushback
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.DBX_STORE_BOT_TOKEN }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          git config user.name "dbx-store-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(store): sign plugin candidates from PR #${PR_NUMBER}"
          push_status="pushed-github-token"
          if ! git push origin "HEAD:${HEAD_REF}"; then
            if [ -n "$BOT_TOKEN" ]; then
              git push "https://x-access-token:${BOT_TOKEN}@github.com/${HEAD_REPO}.git" "HEAD:${HEAD_REF}" || push_status="push-failed"
              [ "$push_status" = "push-failed" ] || push_status="pushed-bot-token"
            else
              push_status="push-failed"
            fi
          fi
          echo "status=$push_status" >> "$GITHUB_OUTPUT"
          if [ "$push_status" = "push-failed" ]; then
            git format-patch --stdout origin/"${HEAD_REF}"..HEAD > "$GITHUB_WORKSPACE/signed-catalog.patch" || true
            echo "push=failed" >> "$GITHUB_ENV"
          else
            echo "push=ok" >> "$GITHUB_ENV"
          fi

      - name: Upload signed catalog patch (fallback)
        if: env.push == 'failed'
        uses: actions/upload-artifact@v4
        with:
          name: signed-catalog-patch-${{ inputs.pr-number }}
          if-no-files-found: error
          retention-days: 30
          path: signed-catalog.patch

      - name: Report on pull request
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUSH_NOTE="The finalized catalog was committed back to this pull request."
          if [ "$push" = "failed" ]; then
            PUSH_NOTE="Pushing back failed (fork without maintainer edits, or no DBX_STORE_BOT_TOKEN configured). Download the 'signed-catalog-patch' workflow artifact and apply it to this branch, then push manually."
          fi
          SUMMARY=$(node <<'NODE'
          const fs = require("node:fs");
          const digests = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + "/signout/signed.json", "utf8"));
          const lines = Object.entries(digests).map(([key, value]) => `- \`${key}\` → sha256 \`${value.sha256}\` (${value.size} bytes)`);
          console.log(["**DBX Store signing completed for PR #" + process.env.PR_NUMBER + "**", "", ...lines].join("\n"));
          NODE
          )
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(printf '%s\n\n%s' "$SUMMARY" "$PUSH_NOTE")"
