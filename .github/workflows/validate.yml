name: Validate catalog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - name: Verify generated catalog is committed
        run: git diff --exit-code -- catalog/index.json
      - name: Test release sync failure isolation
        run: node --test tests/*.test.mjs
